<svg width="1024" height="320" viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: var(--primary-color, #03a9f4);
    }
  </style>
  <!-- Left Icon Mark -->
  <g transform="translate(16, -16) scale(0.68)">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Virtual Device Box & Chip Nodes -->
    <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke-width="24" stroke="currentColor" />
    <path d="M 96 220 L 416 220" stroke-width="20" stroke="currentColor" stroke-dasharray="16 16" />
    <circle cx="176" cy="158" r="24" fill="currentColor" stroke="none" />
    <circle cx="256" cy="158" r="24" fill="currentColor" stroke="none" />
    <circle cx="336" cy="158" r="24" fill="currentColor" stroke="none" />
    <rect x="152" y="276" width="208" height="28" rx="14" fill="none" stroke-width="20" stroke="currentColor" />
    <circle cx="210" cy="290" r="26" fill="currentColor" stroke="none" />
    <!-- External Connectors -->
    <line x1="256" y1="56" x2="256" y2="96" stroke-width="20" stroke="currentColor" />
    <line x1="256" y1="416" x2="256" y2="456" stroke-width="20" stroke="currentColor" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(360, 96)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0f172a" letter-spacing="-1">
      Virtual Device <tspan fill="#03a9f4">Entities</tspan>
    </text>
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#64748b" letter-spacing="0.5">
      Simulated Devices &amp; Test Entities for Home Assistant
    </text>
  </g>
</svg>
